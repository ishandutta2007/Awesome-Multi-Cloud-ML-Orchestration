<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0d17" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#05070f" />
    </linearGradient>

    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#4facfe" />
    </linearGradient>

    <linearGradient id="neonPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b224ef" />
      <stop offset="100%" stop-color="#7579ff" />
    </linearGradient>

    <linearGradient id="neonAmber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#ef4444" />
    </linearGradient>

    <!-- Filters for Glow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.75" stroke-opacity="0.45" />
      <circle cx="40" cy="40" r="1.5" fill="#38bdf8" fill-opacity="0.25" />
    </pattern>

    <!-- CSS Keyframe Animations -->
    <style>
      @keyframes dashFlow {
        from {
          stroke-dashoffset: 80;
        }
        to {
          stroke-dashoffset: 0;
        }
      }

      @keyframes pulseGlow {
        0%, 100% {
          opacity: 0.35;
          transform: scale(1);
        }
        50% {
          opacity: 0.7;
          transform: scale(1.05);
        }
      }

      @keyframes orbitRotate {
        from {
          transform: rotate(0deg);
        }
        to {
          transform: rotate(360deg);
        }
      }

      @keyframes floatSlow {
        0%, 100% {
          transform: translateY(0px);
        }
        50% {
          transform: translateY(-8px);
        }
      }

      .flow-line-1 {
        stroke-dasharray: 8, 8;
        animation: dashFlow 2.5s linear infinite;
      }
      .flow-line-2 {
        stroke-dasharray: 6, 6;
        animation: dashFlow 3.5s linear infinite reverse;
      }
      .flow-line-3 {
        stroke-dasharray: 10, 6;
        animation: dashFlow 4s linear infinite;
      }
      .pulse-orb {
        animation: pulseGlow 4s ease-in-out infinite;
        transform-origin: center;
      }
      .floating-node {
        animation: floatSlow 5s ease-in-out infinite;
      }
      .orbit-ring {
        animation: orbitRotate 25s linear infinite;
        transform-origin: 600px 210px;
      }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1200" height="420" rx="16" fill="url(#bgGrad)" />
  <rect width="1200" height="420" rx="16" fill="url(#grid)" />

  <!-- Ambient Glow Spheres (Background) -->
  <circle cx="150" cy="90" r="140" fill="#38bdf8" filter="url(#glow)" class="pulse-orb" opacity="0.18" />
  <circle cx="1050" cy="330" r="160" fill="#a855f7" filter="url(#glow)" class="pulse-orb" opacity="0.18" style="animation-delay: 2s;" />
  <circle cx="600" cy="210" r="220" fill="#6366f1" filter="url(#glow)" class="pulse-orb" opacity="0.12" style="animation-delay: 1s;" />

  <!-- Dynamic Network Mesh / Animated Data Flow Lines -->
  <g opacity="0.65">
    <!-- Orbital Guide Rings -->
    <circle cx="600" cy="210" r="280" fill="none" stroke="#334155" stroke-width="1.2" stroke-dasharray="4,8" class="orbit-ring" opacity="0.4" />
    <circle cx="600" cy="210" r="390" fill="none" stroke="#1e293b" stroke-width="1" stroke-dasharray="6,12" class="orbit-ring" opacity="0.3" style="animation-direction: reverse; animation-duration: 40s;" />

    <!-- Dynamic Flow Paths -->
    <!-- AWS (top-left) to Central Multi-Cloud Switch -->
    <path d="M 160,110 C 320,110 440,160 540,195" fill="none" stroke="#38bdf8" stroke-width="2" class="flow-line-1" />
    <!-- GCP (bottom-left) to Central Multi-Cloud Switch -->
    <path d="M 180,310 C 340,310 450,260 540,225" fill="none" stroke="#34d399" stroke-width="2" class="flow-line-2" />
    <!-- Azure (top-right) to Central Multi-Cloud Switch -->
    <path d="M 1040,110 C 880,110 760,160 660,195" fill="none" stroke="#818cf8" stroke-width="2" class="flow-line-1" />
    <!-- Bare-Metal / On-Prem GPU Cluster (bottom-right) to Central Switch -->
    <path d="M 1020,310 C 860,310 750,260 660,225" fill="none" stroke="#f472b6" stroke-width="2" class="flow-line-3" />
    
    <!-- Cross-cloud failover interconnect -->
    <path d="M 160,110 C 220,210 220,240 180,310" fill="none" stroke="#38bdf8" stroke-width="1.2" stroke-dasharray="3,6" opacity="0.3" />
    <path d="M 1040,110 C 980,210 980,240 1020,310" fill="none" stroke="#c084fc" stroke-width="1.2" stroke-dasharray="3,6" opacity="0.3" />
  </g>

  <!-- Interactive Nodes / Cloud Pills (Background & Midground) -->
  <g class="floating-node">
    <!-- Node: AWS Cloud -->
    <g transform="translate(90, 85)">
      <rect width="130" height="42" rx="21" fill="#0f172a" stroke="#ff9900" stroke-width="1.5" filter="url(#subtleGlow)" />
      <circle cx="24" cy="21" r="7" fill="#ff9900" />
      <text x="40" y="26" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="700">AWS Spot</text>
    </g>

    <!-- Node: GCP TPU / GPU -->
    <g transform="translate(100, 285)">
      <rect width="145" height="42" rx="21" fill="#0f172a" stroke="#34d399" stroke-width="1.5" filter="url(#subtleGlow)" />
      <circle cx="24" cy="21" r="7" fill="#34d399" />
      <text x="40" y="26" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="700">GCP Batch/TPU</text>
    </g>

    <!-- Node: Azure AI -->
    <g transform="translate(970, 85)">
      <rect width="135" height="42" rx="21" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5" filter="url(#subtleGlow)" />
      <circle cx="24" cy="21" r="7" fill="#0078d4" />
      <text x="40" y="26" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="700">Azure Batch</text>
    </g>

    <!-- Node: Bare-Metal GPU -->
    <g transform="translate(950, 285)">
      <rect width="155" height="42" rx="21" fill="#0f172a" stroke="#c084fc" stroke-width="1.5" filter="url(#subtleGlow)" />
      <circle cx="24" cy="21" r="7" fill="#c084fc" />
      <text x="40" y="26" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="700">On-Prem / Metal</text>
    </g>
  </g>

  <!-- Foreground Center Card Backplate (Guarantees Text Readability) -->
  <g transform="translate(240, 50)">
    <rect width="720" height="315" rx="24" fill="#070c18" fill-opacity="0.88" stroke="#1e293b" stroke-width="1.5" filter="url(#glow)" />
    <rect width="720" height="315" rx="24" fill="none" stroke="url(#titleGrad)" stroke-width="1.2" opacity="0.4" />
  </g>

  <!-- FOREGROUND TEXT (Crystal Clear, High Contrast, Prominent) -->
  <g>
    <!-- Top Pill Badge -->
    <g transform="translate(450, 75)">
      <rect width="300" height="30" rx="15" fill="#1e293b" stroke="#38bdf8" stroke-width="1" />
      <circle cx="18" cy="15" r="4" fill="#38bdf8" />
      <text x="32" y="20" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="600" letter-spacing="1">⚡ VENDOR-NEUTRAL AI INFRASTRUCTURE</text>
    </g>

    <!-- Main Title -->
    <text x="600" y="155" text-anchor="middle" fill="url(#titleGrad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="37" font-weight="900" letter-spacing="-0.5">
      Awesome Multi-Cloud ML Orchestration
    </text>

    <!-- Subtitle -->
    <text x="600" y="196" text-anchor="middle" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="500">
      Curated Ecosystem for Cross-Cloud Workload Scheduling, Spot Recovery &amp; GPU Arbitrage
    </text>

    <!-- Horizontal Divider -->
    <line x1="360" y1="222" x2="840" y2="222" stroke="#334155" stroke-width="1" stroke-dasharray="4,4" />

    <!-- Feature Highlights / Capability Pills -->
    <g transform="translate(320, 242)">
      <!-- Pill 1: GPU Arbitrage -->
      <g transform="translate(0, 0)">
        <rect width="130" height="28" rx="14" fill="#0f172a" stroke="#38bdf8" stroke-width="1" />
        <text x="65" y="18" text-anchor="middle" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600">💰 GPU Arbitrage</text>
      </g>
      <!-- Pill 2: Spot Auto-Recovery -->
      <g transform="translate(142, 0)">
        <rect width="138" height="28" rx="14" fill="#0f172a" stroke="#34d399" stroke-width="1" />
        <text x="69" y="18" text-anchor="middle" fill="#34d399" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600">🔄 Spot Auto-Recovery</text>
      </g>
      <!-- Pill 3: Distributed Ray/Batch -->
      <g transform="translate(292, 0)">
        <rect width="140" height="28" rx="14" fill="#0f172a" stroke="#818cf8" stroke-width="1" />
        <text x="70" y="18" text-anchor="middle" fill="#818cf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600">⚡ Distributed Ray</text>
      </g>
      <!-- Pill 4: Zero Vendor Lock-in -->
      <g transform="translate(444, 0)">
        <rect width="126" height="28" rx="14" fill="#0f172a" stroke="#c084fc" stroke-width="1" />
        <text x="63" y="18" text-anchor="middle" fill="#c084fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600">🔓 Zero Lock-in</text>
      </g>
    </g>

    <!-- Bottom Tech Stack Tagline -->
    <text x="600" y="318" text-anchor="middle" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500">
      dstack • SkyPilot • Ray • Bacalhau • Flyte • Kubeflow • Nomad • AWS • GCP • Azure
    </text>
  </g>
</svg>
